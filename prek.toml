default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

# --- Conventional Commits ---
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"  # frozen: v4.4.0
hooks = [
  {
    id = "conventional-pre-commit",
    stages = ["commit-msg"],
    # Listing types replaces the hook's defaults, so the list repeats them and adds `deps`, which marks a runtime floor change.
    args = [
      "--strict",
      "build",
      "chore",
      "ci",
      "deps",
      "docs",
      "feat",
      "fix",
      "perf",
      "refactor",
      "revert",
      "style",
      "test",
    ]
  }
]

# --- Gitleaks ---
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [
  { id = "gitleaks" },
  # `gitleaks` scans staged changes and CI stages nothing, so CI runs this copy on the commits HEAD adds to its first parent.
  { id = "gitleaks", alias = "gitleaks-ci", stages = ["manual"], entry = "gitleaks git --redact --verbose", args = ["--log-opts=HEAD^1..HEAD"] },
]

# --- Zizmor ---
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
hooks = [{ id = "zizmor" }]

# --- actionlint ---
# zizmor checks workflows for security problems, and actionlint checks that they are valid.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [{ id = "actionlint" }]

# --- typos ---
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "512fc24f32f44ab01972217aaaf3dc86ec234d53"  # frozen: v1.50.2
hooks = [{ id = "typos" }]

# --- Built-in ---
# prek ships these hooks itself, so they need no clone and no pin.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # Without the flag, the hook checks only while a merge is in progress, so CI checked nothing.
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "check-yaml" },
  # The editors' settings.json files are JSON with comments, which check-json rejects.
  { id = "check-json", exclude = "settings\\.json$" },
  { id = "check-case-conflict" },
  # A lockfile is as large as the dependency tree; a Dagster project's `uv.lock` passes 500 KB.
  { id = "check-added-large-files", exclude = '^uv\.lock$' },
  { id = "detect-private-key" },
]

# --- rumdl ---
[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "b0cff962ee693b9e612c097d22e71e0cba127447"  # frozen: v0.3.2
hooks = [{ id = "rumdl-check", args = ["--fix"] }]

# --- tombi ---
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "67d13bcf8d97660524276ba6716c22211aa59f3b"  # frozen: v1.9.9
hooks = [
  { id = "tombi-lint" },
  { id = "tombi-format" },
]
