[ai]
allow_provider_config = true
enabled = true

[ai.custom_providers]

[ai.models]
custom_models = []
displayed_models = []

[completion]
activate_on_typing = true
auto_close_pairs = true
copilot = false
signature_hint_on_typing = true

[diagnostics]
enabled = true
sql_linter = true

[display]
cell_output = "below"
code_editor_font_size = 16
code_lens = true
dataframes = "rich"
default_table_max_columns = 200
default_table_page_size = 10
default_width = "full"
reference_highlighting = true
theme = "light"

[formatting]
line_length = 88

[keymap]
preset = "default"

[keymap.overrides]

[language_servers.pylsp]
enable_flake8 = false
enable_mypy = true
enable_pydocstyle = false
enable_pyflakes = false
enable_pylint = false
enable_ruff = true
enabled = false

[language_servers.pyrefly]
enabled = true

[language_servers.ty]
enabled = false

[mcp]
presets = []

[mcp.mcpServers]

[package_management]
manager = "uv"

[runtime]
auto_instantiate = false
auto_reload = "autorun"
default_csv_encoding = "utf-8"
default_sql_output = "auto"
on_cell_change = "lazy"
output_max_bytes = 8000000
reactive_tests = true
show_tracebacks = false
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[server]
browser = "open -a 'Google Chrome' %s"
follow_symlink = false

[snippets]
custom_paths = []
include_default_snippets = true
